name: SaveFlow CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build React frontend and TypeScript backend
        run: npm run build
      - name: Build production Docker image
        run: docker build -t saveflow:${{ github.sha }} .

name: Bootstrap SaveFlow source

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination repository
        uses: actions/checkout@v4
      - name: Download preserved SaveFlow source
        shell: bash
        run: |
          curl --fail --location --retry 3 "https://raw.githubusercontent.com/Iqra0076r/saveitbro.fun/df318e3ea714ac15579ceb5e0500507badbf3172/saveflow-source.tar.gz" --output /tmp/saveflow-source.tar.gz
          mkdir -p /tmp/saveflow-source
          tar -xzf /tmp/saveflow-source.tar.gz -C /tmp/saveflow-source
      - name: Copy source into dedicated repository
        shell: bash
        run: |
          cp -a /tmp/saveflow-source/. ./
          rm -rf source-parts
          rm -f saveflow-source.tar.gz
          rm -f .actions-trigger
          rm -f .github/workflows/bootstrap-source.yml
      - name: Commit source migration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: migrate SaveFlow source into dedicated repository"
          git push

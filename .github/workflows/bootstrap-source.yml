name: One-time SaveFlow source migration

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message != 'chore: migrate SaveFlow source into dedicated repository'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download the preserved SaveFlow source bundle
        run: |
          curl -fL "https://raw.githubusercontent.com/Iqra0076r/saveitbro.fun/df318e3ea714ac15579ceb5e0500507badbf3172/saveflow-source.tar.gz" -o /tmp/saveflow-source.tar.gz
          mkdir -p /tmp/saveflow-source
          tar -xzf /tmp/saveflow-source.tar.gz -C /tmp/saveflow-source
      - name: Move source into this repository
        run: |
          rsync -a --delete             --exclude='.git/'             --exclude='.github/workflows/bootstrap-source.yml'             /tmp/saveflow-source/ ./
          rm -rf source-parts
          rm -f saveflow-source.tar.gz
          rm -f .github/workflows/bootstrap-source.yml
      - name: Commit migrated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "chore: migrate SaveFlow source into dedicated repository"
          git push
